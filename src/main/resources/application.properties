spring.application.name=DeltaEdge
server.port=5454

# ==========================================
# DATABASE CONFIGURATION (H2 IN-MEMORY)
# ==========================================
spring.datasource.url=jdbc:h2:mem:deltaedge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console (Access at http://localhost:5454/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# EXTERNAL INTEGRATIONS
# ==========================================
razorpay.api.key=${RAZORPAY_KEY:rzp_test_placeholder}
razorpay.api.secret=${RAZORPAY_SECRET:secret_placeholder}

spring.data.redis.host=localhost
spring.data.redis.port=6379
app.cache.coin.ttl=60

